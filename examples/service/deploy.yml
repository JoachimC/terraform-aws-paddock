# Copy to .github/workflows/deploy.yml in a paddock's repository. It reads
# the repository variables that modules/paddock prints (PADDOCK, AWS_REGION,
# TF_STATE_BUCKET, TF_STATE_KEY, AWS_DEPLOY_ROLE_ARN, AWS_PLAN_ROLE_ARN).
#
# A pull request plans with the read-only plan role. A push to main applies
# with the deploy role. Each role's trust policy accepts only its own event,
# so a pull request can never assume the deploy role.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Two runs on one state would only queue on the lock. Never cancel an apply
# halfway.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_paddock: ${{ vars.PADDOCK }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC token that AWS trades for a role session.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ${{ vars.PADDOCK }}-${{ github.run_id }}

      # The wrapper rewrites stdout and breaks `terraform output -raw`.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Build the function package here, for example with cargo lambda.

      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan
