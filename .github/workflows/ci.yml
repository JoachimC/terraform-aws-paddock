name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. The workflow pins third-party actions to commit SHAs (the tag is
# in the comment) so a moved tag cannot change what runs.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in
# progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every check runs with both tools, because the modules promise both. A
  # feature that only one of them has fails here first. The script runs the
  # tools in their official images, so CI and a local run use the same
  # versions.
  check:
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check.sh ${{ matrix.tool }}

  # check.sh pins the oldest supported version (1.10). This job runs the
  # newest, so a deprecation shows before it becomes a break.
  check-latest:
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check.sh --latest ${{ matrix.tool }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same image as the local command in CONTRIBUTING.md.
      - run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:stable scripts/*.sh
